{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} product — NovaCart{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-card wide-card"><span class="eyebrow">STORE CONTROL</span><h1>{{ 'Edit product' if product else 'Add a product' }}</h1><form method="post" class="stack-form">
<label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label>
<label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label>
<div class="form-grid"><label>Price (₹)<input type="number" name="price" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Stock quantity<input type="number" name="stock" min="0" required value="{{ product.stock if product else 0 }}"></label></div>
<label>Category<input name="category" required value="{{ product.category if product else '' }}" placeholder="Electronics, Fashion, Home..."></label>
<label>Image URL<input type="url" name="image_url" value="{{ product.image_url if product else '' }}" placeholder="https://..."></label>
<label class="check-label"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Featured product</label>
{% if product %}<label class="check-label"><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Visible in store</label>{% endif %}
<button class="btn btn-primary btn-large">Save product</button><a class="continue-link" href="{{ url_for('admin') }}">Cancel</a>
</form></div></section>
{% endblock %}
